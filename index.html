<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城市出行小顾问</title>
  <script>
    // 提前设置主题，避免首屏闪烁
    (function(){
      try {
        var saved = localStorage.getItem("cwa-theme");
        if(saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        } else if(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch(e){}
    })();
  </script>
  <style>
    /* ===== 1. 设计 token ===== */
    /* 浅色：沿用旧版清爽观感（蓝主色 + 蓝灰底）；深色：新版中性风 */
    :root{
      --bg:#f5f7fa;            /* 页面底（偏蓝冷灰） */
      --surface:#ffffff;       /* 卡片 */
      --surface-2:#f7f9fc;     /* 卡片内次级块 */
      --text:#2c2c2a;          /* 主文字 */
      --text-2:#5f5e5a;        /* 次级文字 */
      --text-3:#a1a1aa;        /* 提示 / 占位 */
      --border:#e3e6ea;        /* 描边 */
      --primary:#185FA5;       /* 主按钮底（旧版蓝） */
      --primary-text:#ffffff;  /* 主按钮字 */
      --primary-hover:#144e89;
      --accent:#185FA5;        /* 聚焦 / 链接 */
      --good:#0F6E56;  --good-bg:#E1F5EE;  --good-line:#0F6E56;
      --warn:#BA7517;  --warn-bg:#FAEEDA;  --warn-line:#BA7517;
      --bad:#A32D2D;   --bad-bg:#FCEBEB;   --bad-line:#A32D2D;

      --radius-sm:6px; --radius:8px; --radius-lg:14px; --radius-full:999px;
      --shadow-1:none;         /* 浅色靠描边分层，不加阴影 */
      --shadow-2:0 4px 16px rgba(0,0,0,.08);
      --dur:150ms; --ease:cubic-bezier(.4,0,.2,1);
      color-scheme: light;
    }
    [data-theme="dark"]{
      --bg:#09090b;
      --surface:#18181b;
      --surface-2:#27272a;
      --text:#fafafa;
      --text-2:#a1a1aa;
      --text-3:#71717a;
      --border:#27272a;
      --primary:#fafafa;
      --primary-text:#18181b;
      --primary-hover:#e4e4e7;
      --accent:#60a5fa;
      --good:#86efac; --good-bg:rgba(22,163,74,.14);  --good-line:#4ade80;
      --warn:#fcd34d; --warn-bg:rgba(217,119,6,.16);  --warn-line:#fbbf24;
      --bad:#fca5a5;  --bad-bg:rgba(220,38,38,.16);   --bad-line:#f87171;
      --shadow-1:0 1px 2px rgba(0,0,0,.3);
      --shadow-2:0 4px 16px rgba(0,0,0,.45);
      color-scheme: dark;
    }

    /* ===== 2. 基础 ===== */
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
      background:var(--bg); color:var(--text);
      padding:32px 24px 40px; font-size:14px; line-height:1.6;
      -webkit-font-smoothing:antialiased;
      transition:background-color var(--dur) var(--ease), color var(--dur) var(--ease);
    }
    .wrap{ max-width:680px; margin:0 auto; }

    /* ===== 3. 页头 ===== */
    .header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
    h1{ font-size:22px; font-weight:500; margin:0; letter-spacing:-.01em; }
    .sub{ color:var(--text-2); font-size:13px; margin:6px 0 24px; max-width:52ch; }
    .toggle{
      background:var(--surface); color:var(--text-2); border:1px solid var(--border);
      border-radius:var(--radius-full); padding:6px 12px; font-size:13px; cursor:pointer;
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
      transition:border-color var(--dur) var(--ease), color var(--dur) var(--ease), background-color var(--dur) var(--ease);
    }
    .toggle:hover{ border-color:var(--text-3); color:var(--text); }
    .toggle svg{ width:15px; height:15px; }

    /* ===== 4. 搜索区 ===== */
    .search{ display:flex; gap:8px; }
    input{
      flex:1; min-width:0; height:40px; padding:0 14px; font-size:15px;
      border:1px solid var(--border); border-radius:var(--radius); outline:none;
      background:var(--surface); color:var(--text); font-family:inherit;
      transition:border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
    }
    input::placeholder{ color:var(--text-3); }
    input:focus{ border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
    button.primary{
      height:40px; padding:0 20px; font-size:15px; color:var(--primary-text); background:var(--primary);
      border:1px solid var(--primary); border-radius:var(--radius); cursor:pointer; font-family:inherit;
      display:inline-flex; align-items:center; gap:6px;
      transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    button.primary:hover:not(:disabled){ background:var(--primary-hover); border-color:var(--primary-hover); }
    button.primary:disabled{ opacity:.5; cursor:default; }
    button.primary svg{ width:16px; height:16px; }

    /* ===== 5. 卡片 ===== */
    .card{
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg);
      padding:20px; margin-top:16px; box-shadow:var(--shadow-1);
      transition:background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .card-title{
      font-size:13px; font-weight:500; color:var(--text-2);
      margin:0 0 14px; display:flex; align-items:center; gap:6px;
    }
    .place{ font-size:13px; color:var(--text-2); margin-bottom:16px; }

    /* ===== 6. 指标网格 ===== */
    .grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .item{ background:var(--surface-2); border-radius:var(--radius); padding:12px 14px; }
    .item .k{ font-size:12px; color:var(--text-3); }
    .item .v{
      font-size:19px; font-weight:500; margin-top:2px; letter-spacing:-.01em;
      font-variant-numeric:tabular-nums;
    }

    /* ===== 7. 建议（左侧色条 alert） ===== */
    .advice{
      margin-top:12px; padding:12px 14px; border-radius:var(--radius);
      font-size:14px; line-height:1.6; border-left:3px solid var(--border);
      background:var(--surface-2); color:var(--text);
    }
    .advice.go{ background:var(--good-bg); border-left-color:var(--good-line); }
    .advice.caution{ background:var(--warn-bg); border-left-color:var(--warn-line); }
    .advice.no{ background:var(--bad-bg); border-left-color:var(--bad-line); }
    .advice b{ font-weight:500; }

    /* ===== 8. 预报 / 回顾 ===== */
    .forecast{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
    .day{
      background:var(--surface-2); border:1px solid transparent; border-radius:var(--radius);
      padding:12px 10px; text-align:center;
    }
    .day .d{ font-size:12px; color:var(--text-3); }
    .day .w{ font-size:14px; font-weight:500; margin:4px 0 2px; color:var(--text); }
    .day .t{ font-size:13px; color:var(--text-2); font-variant-numeric:tabular-nums; }
    .day .meta{ font-size:11px; color:var(--text-3); margin-top:4px; }
    .day .pop{ color:var(--accent); font-weight:500; }
    .day.severe{ border-color:var(--bad-line); background:var(--bad-bg); }
    .day.caution{ border-color:var(--warn-line); background:var(--warn-bg); }
    .badge{
      display:inline-flex; align-items:center; gap:4px;
      font-size:11px; font-weight:500; padding:2px 8px;
      border-radius:var(--radius-full); margin-bottom:6px;
    }
    .badge svg{ width:12px; height:12px; }
    .badge.sev{ background:var(--bad-line); color:#fff; }
    .badge.warn{ background:var(--warn-line); color:#fff; }

    /* ===== 9. 状态：加载 / 错误 / 空 ===== */
    .spin{ margin-top:16px; display:grid; gap:10px; }
    .sk{ height:96px; border-radius:var(--radius-lg); background:var(--surface); border:1px solid var(--border); }
    .empty{
      grid-column:1/-1; text-align:center; padding:20px 12px; font-size:13px; color:var(--text-3);
      border:1px dashed var(--border); border-radius:var(--radius); background:transparent;
    }
    .err{
      margin-top:16px; font-size:13px; color:var(--text);
      background:var(--bad-bg); border-left:3px solid var(--bad-line);
      border-radius:var(--radius); padding:12px 14px;
    }
    .foot{
      margin-top:20px; padding-top:16px; border-top:1px solid var(--border);
      font-size:12px; color:var(--text-3);
    }
    .hidden{ display:none; }

    /* ===== 10. 入场动画（可降级） ===== */
    @keyframes rise{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
    @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.55; } }
    @media (prefers-reduced-motion: no-preference){
      .reveal{ animation:rise var(--dur) var(--ease) both; }
      .sk{ animation:pulse 1.4s ease-in-out infinite; }
    }

    /* ===== 11. 窄屏 ===== */
    @media (max-width:560px){
      body{ padding:24px 16px 32px; }
      h1{ font-size:20px; }
      .grid{ grid-template-columns:repeat(2,1fr); }
      .item .v{ font-size:17px; }
      .forecast{ gap:8px; }
      .day{ padding:10px 6px; }
      .search{ flex-wrap:nowrap; }
      button.primary{ padding:0 16px; }
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>城市出行小顾问</h1>
    <button id="themeBtn" class="toggle" type="button" aria-label="切换主题"></button>
  </div>
  <div class="sub">输入一个城市（精确到市），自动查海拔、温湿度、天气、未来三天预报，并给出出行与穿衣建议</div>
  <div class="search">
    <input id="city" placeholder="例如：广州市 / 北京市 / 成都市" />
    <button id="go" class="primary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      查询
    </button>
  </div>
  <div id="status" class="spin hidden"><div class="sk"></div><div class="sk"></div></div>
  <div id="err" class="err hidden"></div>
  <div id="result" class="hidden">
    <div class="card reveal">
      <div class="place" id="place"></div>
      <div class="grid">
        <div class="item"><div class="k">海拔</div><div class="v" id="elev"></div></div>
        <div class="item"><div class="k">气温</div><div class="v" id="temp"></div></div>
        <div class="item"><div class="k">体感温度</div><div class="v" id="feel"></div></div>
        <div class="item"><div class="k">相对湿度</div><div class="v" id="humid"></div></div>
        <div class="item"><div class="k">天气</div><div class="v" id="weather"></div></div>
        <div class="item"><div class="k">风速</div><div class="v" id="wind"></div></div>
      </div>
      <div id="goAdv" class="advice"></div>
      <div id="clothAdv" class="advice"></div>
    </div>
    <div class="card reveal">
      <div class="card-title">过去 3 天回顾</div>
      <div id="past" class="forecast"></div>
    </div>
    <div class="card reveal">
      <div class="card-title">未来 3 天预报</div>
      <div id="forecast" class="forecast"></div>
    </div>
  </div>
  <div class="foot">数据来源：Open-Meteo（免费、无需密钥）</div>
</div>
<script>
  const WMO = {
    0:"晴",1:"大致晴朗",2:"局部多云",3:"阴",
    45:"雾",48:"雾凇",
    51:"小毛毛雨",53:"毛毛雨",55:"大毛毛雨",
    56:"冻毛毛雨",57:"冻毛毛雨",
    61:"小雨",63:"中雨",65:"大雨",
    66:"冻雨",67:"强冻雨",
    71:"小雪",73:"中雪",75:"大雪",77:"雪粒",
    80:"小阵雨",81:"阵雨",82:"强阵雨",
    85:"小阵雪",86:"强阵雪",
    95:"雷暴",96:"雷暴伴冰雹",99:"强雷暴伴冰雹"
  };
  const DAY_LABELS = { "-3":"大前天", "-2":"前天", "-1":"昨天", "0":"今天", "1":"明天", "2":"后天", "3":"大后天" };

  // 图标：一律内联 SVG，跟随主题色，不用 emoji
  const ICON = {
    moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    alert: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>',
    rain: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 15a4 4 0 0 0-1.5-7.7A6 6 0 0 0 4 8.5 3.5 3.5 0 0 0 4.5 15"/><path d="M8 18v2M12 18v2M16 18v2"/></svg>'
  };

  const $ = id => document.getElementById(id);
  const btn = $("go");
  btn.addEventListener("click", run);
  $("city").addEventListener("keydown", e => { if(e.key==="Enter") run(); });

  // 主题：根据当前 data-theme 更新按钮图标与文案
  function syncToggle(){
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const isDark = cur === "dark";
    $("themeBtn").innerHTML = (isDark ? ICON.sun : ICON.moon) + "<span>" + (isDark ? "浅色" : "深色") + "</span>";
  }
  syncToggle();
  $("themeBtn").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "light";
    const next = cur === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    syncToggle();
    try { localStorage.setItem("cwa-theme", next); } catch(e){}
  });

  async function geocode(name) {
    const g = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(name)}&count=1&language=zh&format=json`);
    const gj = await g.json();
    return (gj.results && gj.results.length) ? gj.results[0] : null;
  }

  async function run() {
    const name = $("city").value.trim();
    if(!name) { showErr("请输入城市名"); return; }
    hide($("result")); hide($("err")); show($("status"));
    btn.disabled = true;
    try {
      let r = await geocode(name);
      if(!r) {
        const alt = name.replace(/(市|省|县|区|自治州|盟)$/,"");
        if(alt !== name) r = await geocode(alt);
      }
      if(!r) throw new Error("没找到这个城市，换个写法试试（比如输入「广州」而不是「广州市」）");
      const lat = r.latitude, lon = r.longitude;
      $("place").textContent = `${r.name} · ${r.admin1 || ""} · ${r.country || ""}`;

      const [eRes, wRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/elevation?latitude=${lat}&longitude=${lon}`),
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&past_days=3&forecast_days=4&timezone=auto`)
      ]);
      const ej = await eRes.json();
      const wj = await wRes.json();
      const elev = ej.elevation ? ej.elevation[0] : null;
      const c = wj.current;

      $("elev").textContent = elev != null ? `${Math.round(elev)} m` : "—";
      $("temp").textContent = c.temperature_2m != null ? `${c.temperature_2m}°C` : "—";
      $("feel").textContent = c.apparent_temperature != null ? `${c.apparent_temperature}°C` : "—";
      $("humid").textContent = c.relative_humidity_2m != null ? `${c.relative_humidity_2m}%` : "—";
      $("weather").textContent = WMO[c.weather_code] != null ? WMO[c.weather_code] : "未知";
      $("wind").textContent = c.wind_speed_10m != null ? `${c.wind_speed_10m} km/h` : "—";

      const todayStr = (c.time || "").slice(0, 10);
      const todayIdx = (wj.daily && wj.daily.time) ? wj.daily.time.indexOf(todayStr) : -1;

      renderPast(wj.daily, todayIdx);
      renderForecast(wj.daily, todayIdx);
      renderAdvice(c);
      show($("result"));
    } catch(e) {
      showErr(e.message || "查询失败，请稍后再试");
    } finally {
      hide($("status")); btn.disabled = false;
    }
  }

  const SEVERE = [95,96,99,65,67,75,82,86]; // 雷暴/冰雹/大雨/强冻雨/大雪/强阵雨/强阵雪
  const CAUTION_POP = 70; // 高降水概率阈值（%）

  function renderPast(daily, todayIdx) {
    const el = $("past");
    el.innerHTML = "";
    if(!daily || !daily.time || todayIdx < 3) {
      el.innerHTML = '<div class="empty">暂无历史数据</div>';
      return;
    }
    for(let i = todayIdx - 3; i < todayIdx; i++) {
      const code = daily.weather_code[i];
      const wmo = WMO[code] != null ? WMO[code] : "未知";
      const tmax = daily.temperature_2m_max[i];
      const tmin = daily.temperature_2m_min[i];
      const rain = daily.precipitation_sum ? daily.precipitation_sum[i] : null;
      const wind = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[i] : null;
      const day = document.createElement("div");
      day.className = "day";
      const hasRain = rain != null && rain > 0;
      day.innerHTML = `
        <div class="d">${DAY_LABELS[i - todayIdx] || daily.time[i]}</div>
        <div class="w">${wmo}</div>
        <div class="t">${tmax != null ? Math.round(tmax) : "—"}° / ${tmin != null ? Math.round(tmin) : "—"}°</div>
        <div class="meta">${hasRain ? "降水 " + rain + "mm" : ""}${wind != null ? (hasRain ? " · " : "") + "风 " + Math.round(wind) + "km/h" : ""}</div>
      `;
      el.appendChild(day);
    }
  }

  function renderForecast(daily, todayIdx) {
    const el = $("forecast");
    el.innerHTML = "";
    if(!daily || !daily.time || !daily.time.length) {
      el.innerHTML = '<div class="empty">暂无预报数据</div>';
      return;
    }
    // 未来 3 天：今天之后的 3 个索引；找不到"今天"时回退为索引 1,2,3
    const start = todayIdx >= 0 ? todayIdx + 1 : 1;
    const end = Math.min(todayIdx >= 0 ? todayIdx + 4 : 4, daily.time.length);
    for(let i = start; i < end; i++) {
      const code = daily.weather_code[i];
      const wmo = WMO[code] != null ? WMO[code] : "未知";
      const tmax = daily.temperature_2m_max[i];
      const tmin = daily.temperature_2m_min[i];
      const pop = daily.precipitation_probability_max ? daily.precipitation_probability_max[i] : null;
      const wind = daily.wind_speed_10m_max ? daily.wind_speed_10m_max[i] : null;
      const severe = SEVERE.includes(code);
      const caution = !severe && pop != null && pop >= CAUTION_POP;

      const day = document.createElement("div");
      day.className = "day" + (severe ? " severe" : caution ? " caution" : "");
      if(severe) {
        const b = document.createElement("div");
        b.className = "badge sev";
        b.innerHTML = ICON.alert + "<span>严重天气</span>";
        day.appendChild(b);
      } else if(caution) {
        const b = document.createElement("div");
        b.className = "badge warn";
        b.innerHTML = ICON.rain + "<span>高降水概率</span>";
        day.appendChild(b);
      }
      day.insertAdjacentHTML("beforeend", `
        <div class="d">${DAY_LABELS[i - todayIdx] || daily.time[i]}</div>
        <div class="w">${wmo}</div>
        <div class="t">${tmax != null ? Math.round(tmax) : "—"}° / ${tmin != null ? Math.round(tmin) : "—"}°</div>
        <div class="meta">${pop != null ? '<span class="pop">降水 ' + pop + '%</span>' : ""}${wind != null ? (pop != null ? " · " : "") + "风 " + Math.round(wind) + "km/h" : ""}</div>
      `);
      el.appendChild(day);
    }
  }

  function renderAdvice(c) {
    const code = c.weather_code;
    const feel = c.apparent_temperature;
    const wind = c.wind_speed_10m;
    const rain = [51,53,55,56,57,61,63,65,66,67,71,73,75,77,80,81,82,85,86];
    const bad = [95,96,99,82,86,65,75];

    let goCls, goText;
    if(bad.includes(code)) {
      goCls="no"; goText="<b>不建议外出</b>：有雷暴或强降水/降雪，注意安全，尽量待在室内。";
    } else if(rain.includes(code)) {
      goCls="caution"; goText="<b>谨慎外出</b>：有雨雪，记得带伞/雨具，路面湿滑慢行。";
    } else if(feel != null && (feel < 2 || feel > 36)) {
      goCls="caution"; goText = feel < 2
        ? "<b>谨慎外出</b>：体感很冷，注意保暖防滑。"
        : "<b>谨慎外出</b>：体感很热，避开正午、多补水防晒。";
    } else if(wind != null && wind > 30) {
      goCls="caution"; goText="<b>可外出，但注意防风</b>：风力较大，户外注意固定物品。";
    } else {
      goCls="go"; goText="<b>适合外出</b>：天气不错，放心出去玩吧！";
    }
    const ga = $("goAdv"); ga.className = "advice " + goCls; ga.innerHTML = goText;

    let cloth;
    if(feel == null) cloth = "暂无温度数据，无法给出穿衣建议。";
    else if(feel >= 30) cloth = "<b>穿：</b>短袖、短裤等清凉衣物，做好防晒、多喝水。";
    else if(feel >= 24) cloth = "<b>穿：</b>短袖或薄长袖，体感舒适。";
    else if(feel >= 18) cloth = "<b>穿：</b>长袖衬衫或薄外套，早晚微凉可加一件。";
    else if(feel >= 12) cloth = "<b>穿：</b>外套或卫衣，注意保暖。";
    else if(feel >= 5) cloth = "<b>穿：</b>厚外套/毛衣，天气偏冷。";
    else cloth = "<b>穿：</b>羽绒服或厚棉衣，注意保暖防风。";
    if(rain.includes(code)) cloth += " 记得带伞。";
    const ca = $("clothAdv"); ca.className = "advice caution"; ca.innerHTML = cloth;
  }

  function show(el){ el.classList.remove("hidden"); }
  function hide(el){ el.classList.add("hidden"); }
  function showErr(m){ const e = $("err"); e.textContent = m; show(e); }
</script>
</body>
</html>
